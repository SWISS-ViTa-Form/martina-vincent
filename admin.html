<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Mariage</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FAF7F2; color: #2C2C2A; padding: 1.5rem 1rem 3rem; }
    .wrap { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 1rem; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: #7A6E60; margin: 1.5rem 0 0.6rem; font-weight: 500; }
    .hidden { display: none; }
    .login { max-width: 320px; margin: 4rem auto; background: #EDE8E0; border-radius: 12px; padding: 1.5rem; }
    input, select { width: 100%; font-size: 14px; padding: 8px 12px; border-radius: 8px; border: 0.5px solid rgba(0,0,0,0.15); background: white; margin-bottom: 0.75rem; font-family: inherit; }
    button { font-family: inherit; font-size: 13px; padding: 8px 14px; border-radius: 8px; border: none; background: #C4704A; color: white; cursor: pointer; }
    button.ghost { background: white; color: #7A6E60; border: 0.5px solid rgba(0,0,0,0.15); }
    .login button { width: 100%; padding: 10px; }
    .err { background: #FCEBEB; color: #A32D2D; border-radius: 8px; padding: 0.6rem 0.8rem; font-size: 13px; margin-top: 0.75rem; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .bar .right { display: flex; gap: 8px; align-items: center; }
    .bar select { width: auto; margin: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .card { background: #EDE8E0; border-radius: 8px; padding: 0.75rem; text-align: center; }
    .card b { display: block; font-size: 22px; font-weight: 500; color: #C4704A; }
    .card span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #7A6E60; }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; border-radius: 8px; }
    th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #7A6E60; padding: 8px 10px; background: #EDE8E0; white-space: nowrap; }
    td { padding: 8px 10px; border-top: 0.5px solid rgba(0,0,0,0.08); vertical-align: top; }
    .ok { color: #3B6D11; } .no { color: #A32D2D; } .mute { color: #aaa; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="login" id="login-box">
    <h1>Accès admin</h1>
    <input type="email" id="email" placeholder="E-mail" autocomplete="username">
    <input type="password" id="pwd" placeholder="Mot de passe" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Se connecter</button>
    <div class="err hidden" id="login-err"></div>
  </div>

  <div id="app" class="hidden">
    <div class="bar">
      <h1>Réponses des invités</h1>
      <div class="right">
        <select id="filter" onchange="render()">
          <option value="all">Tous</option>
          <option value="present">Présents</option>
          <option value="midi">Midi sur place</option>
          <option value="veg">Végétariens (midi ou soir)</option>
          <option value="absent">Absents</option>
        </select>
        <button class="ghost" onclick="load()">Actualiser</button>
        <button class="ghost" onclick="doLogout()">Déconnexion</button>
      </div>
    </div>
    <div class="err hidden" id="app-err"></div>
    <h2>Résumé (personnes présentes)</h2>
    <div class="cards" id="cards"></div>
    <h2>Détail</h2>
    <div class="scroll"><table>
      <thead><tr><th>Nom</th><th>Type</th><th>Présence</th><th>Dès 10h</th><th>Midi</th><th>Menu midi</th><th>Menu soir</th><th>Allergies</th><th>Chanson</th><th>Message</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
</div>

<script>
const sb = supabase.createClient(
  'https://nmbahwfqyuaakxypphpb.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tYmFod2ZxeXVhYWt4eXBwaHBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NDY5OTEsImV4cCI6MjA5NTIyMjk5MX0.lcj6KHwghwGbkhaEH4c73Qm0KTrIg1y5QBLgynmHH-w'
);
let DATA = [];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  session ? load() : showLogin();
}
function showLogin() { $('app').classList.add('hidden'); $('login-box').classList.remove('hidden'); }

async function doLogin() {
  $('login-err').classList.add('hidden');
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pwd').value });
  if (error) { $('login-err').textContent = 'Connexion refusée : ' + error.message; $('login-err').classList.remove('hidden'); return; }
  $('pwd').value = '';
  load();
}
async function doLogout() { await sb.auth.signOut(); DATA = []; showLogin(); }

async function load() {
  $('login-box').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('app-err').classList.add('hidden');
  const { data, error } = await sb.from('RSVP').select('*').order('created_at', { ascending: false });
  if (error) { $('app-err').textContent = 'Erreur de chargement : ' + error.message; $('app-err').classList.remove('hidden'); return; }
  DATA = data || [];
  render();
}

function yn(v) { return v === 'oui' ? '<span class="ok">Oui</span>' : v === 'non' ? '<span class="mute">Non</span>' : '<span class="mute">–</span>'; }
function menu(v) { return v === 'vegetarien' ? '<b>Végétarien</b>' : v === 'normal' ? 'Normal' : '<span class="mute">–</span>'; }

function render() {
  const present = DATA.filter(e => e.presence === 'present');
  const count = (arr, fn) => arr.filter(fn).length;
  const midi = present.filter(e => e.midi === 'oui');
  const soirNR = count(present, e => !e.menu_soir);
  const cards = [
    ['Réponses', DATA.length],
    ['Présents', present.length],
    ['Absents', count(DATA, e => e.presence === 'absent')],
    ['Adultes', count(present, e => e.type_invite !== 'enfant')],
    ['Enfants', count(present, e => e.type_invite === 'enfant')],
    ['Dès 10h', count(present, e => e.matin === 'oui')],
    ['Midi sur place', midi.length],
    ['Midi normal', count(midi, e => e.menu_midi === 'normal')],
    ['Midi végé', count(midi, e => e.menu_midi === 'vegetarien')],
    ['Soir normal', count(present, e => e.menu_soir === 'normal')],
    ['Soir végé', count(present, e => e.menu_soir === 'vegetarien')]
  ];
  if (soirNR) cards.push(['Soir non indiqué', soirNR]);
  $('cards').innerHTML = cards.map(c => '<div class="card"><b>' + c[1] + '</b><span>' + c[0] + '</span></div>').join('');

  const f = $('filter').value;
  const list = DATA.filter(e =>
    f === 'all' ? true :
    f === 'present' ? e.presence === 'present' :
    f === 'absent' ? e.presence === 'absent' :
    f === 'midi' ? (e.presence === 'present' && e.midi === 'oui') :
    (e.presence === 'present' && (e.menu_midi === 'vegetarien' || e.menu_soir === 'vegetarien')));
  $('rows').innerHTML = list.length ? list.map(e => '<tr>' +
    '<td>' + esc(e.nom) + '</td>' +
    '<td>' + (e.type_invite === 'enfant' ? 'Enfant' : 'Adulte') + '</td>' +
    '<td>' + (e.presence === 'present' ? '<span class="ok">Présent</span>' : '<span class="no">Absent</span>') + '</td>' +
    '<td>' + yn(e.matin) + '</td><td>' + yn(e.midi) + '</td>' +
    '<td>' + menu(e.menu_midi) + '</td><td>' + menu(e.menu_soir) + '</td>' +
    '<td>' + esc(e.allergies) + '</td><td>' + esc(e.chanson) + '</td><td>' + esc(e.msg) + '</td></tr>').join('')
    : '<tr><td colspan="10" class="mute">Aucune réponse</td></tr>';
}
init();
</script>
</body>
</html>
